name: Linting

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ruff lint
        uses: astral-sh/ruff-action@v3
      - name: Ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"
